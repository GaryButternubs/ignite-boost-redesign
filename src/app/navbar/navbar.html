<mat-sidenav-container class="!h-full">
    <mat-sidenav #mobileNav fixedInViewport [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'" [mode]="'over'"
        [opened]="false">
        <mat-toolbar>
            <h1>Ignite-Boost.net</h1>
        </mat-toolbar>
        <mat-nav-list>
            <!--TO-DO: Add submenu for Resources option-->
            <a mat-list-item href="#">Resources</a>
            <a mat-list-item href="#">Add Replay</a>
            <a mat-list-item href="#">Login</a>
            <a mat-list-item href="#">Signup</a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
        @if (isHandset$ | async) {
        <mat-toolbar color="primary">
            <button type="button" aria-label="Toggle sidenav" matIconButton (click)="mobileNav.toggle()">
                <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
            </button>
            <h1>Ignite-Boost.net</h1>
        </mat-toolbar>
        } @else {
        <mat-toolbar class="justify-between">
            <h1>DFCI Replay Database</h1>
            <mat-nav-list class="!inline-flex">
                <!--TO-DO: Add submenu for Resources option-->
                <a mat-list-item [matMenuTriggerFor]="resources"><span class="inline-flex">Resources <mat-icon aria-label="Resources menu dropdown">arrow_drop_down</mat-icon></span></a>
                <a mat-list-item routerLink="/add">Add Replay</a>
                <a mat-list-item routerLink="/login">Login</a>
                <a mat-list-item routerLink="/signup">Signup</a>
            </mat-nav-list>
            <mat-menu #resources="matMenu">
                <ng-template matMenuContent>
                    <a mat-menu-item href="https://sites.google.com/view/dfci-guide/" target="_blank">DFCI Resource Site</a>
                    <a mat-menu-item href="https://wiki.gbl.gg/w/Dengeki_Bunko:_Fighting_Climax/DFCI" target="_blank">DFCI Mizuumi Page</a>
                    <a mat-menu-item href="">Submit a Report</a>
                </ng-template>
            </mat-menu>
        </mat-toolbar>
        }
    </mat-sidenav-content>
</mat-sidenav-container>
