<div 
    class="bg-black/75 w-full"
    animate.enter="select-overlay-enter"
>
    @if (!this.isFull()) {

    } @else {
        <div class="m-2 p-2 flex flex-row gap-10 items-center text-white">
            <span>{{this.replay()?.matchDate}}</span>

            <div class="flex items-center gap-4 justify-center grow">
                <div class="flex justify-end grow basis-1">
                    <span>{{this.replay()?.player1}}</span>
                </div>
                
                <!--Player 1 images-->
                <div class="flex flex-row gap-2 items-center">
                    <img 
                        [ngSrc]="`../../../../assets/asst-menu/sm/${this.assist1().abbr}.png`"
                        width="90"
                        height="48"
                    />
                    <img 
                        [ngSrc]="`../../../../assets/char-menu/sm/${this.char1().abbr}.png`"
                        width="90"
                        height="90"
                    />
                </div>

                <img 
                    ngSrc="../../../../assets/vs_text.png"
                    width="192"
                    height="64"
                    class="h-10 w-fit"
                />

                <!--Player 2 images-->
                <div class="flex flex-row gap-2 items-center">
                    <img 
                        [ngSrc]="`../../../../assets/char-menu/sm/${this.char2().abbr}.png`"
                        width="90"
                        height="90"
                    />
                    <img 
                        [ngSrc]="`../../../../assets/asst-menu/sm/${this.assist2().abbr}.png`"
                        width="90"
                        height="48"
                    />
                </div>

                <div class="flex justify-start grow basis-1">
                    <span>{{this.replay()?.player2}}</span>
                </div>
            </div>

            <!-- <span>{{((this.replay()?.version ?? 2) === 2) ? 'DFCI' : 'DFC'}}</span> -->
            <img 
                [ngSrc]="`../../../../assets/bolt_${((this.replay()?.version ?? 2) === 2) ? 'dfci' : 'dfc'}.png`"
                width="90"
                height="90"
                class="h-14 w-fit"
            />
            <!-- <span>
                <a [href]="this.replay()?.link" target="_blank">Here</a>
            </span> -->
            <a 
                matIconButton 
                aria-label="Replay link" 
                [href]="this.replay()?.link" 
                target="_blank" 
                class="flex items-center w-fit h-fit *:text-4xl *:w-fit *:h-fit *:transition-colors"
                [ngClass]="isIgnition() ? '*:text-(--dfci-color-secondary) *:hover:text-(--dfci-color-tertiary)' : '*:text-(--dfc-color-secondary) *:hover:text-(--dfc-color-tertiary)'"
            >
                <mat-icon>link</mat-icon>
            </a>
        </div>
    }
</div>
