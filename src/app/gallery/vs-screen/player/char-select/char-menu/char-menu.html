<div [ngClass]="`pt-4 pb-2 px-2 bg-black/75 skew-0! mx-1`">
    <div>
        <div class="flex flex-row flex-wrap gap-1 pb-2 justify-center">
            @for (char of this.playableCharacters; track char.abbr) {
                <!--Don't display DFCI exclusive characters if only DFC-->
                @if (!char.ignition || isIgnition()) {
                    <img
                        [ngSrc]="`../../../../../../assets/char-menu/lg/${char.abbr}.png`"
                        [ngClass]="`${isP1() ? 'hover:animate-p1-select' : 'hover:animate-p2-select'}`"
                        width="56"
                        height="144"
                        (mouseenter)="hoveredChar.set(char)"
                        (click)="updateSelectedChar.emit(char)"  
                    />
                }
            }
        </div>
        <span [ngClass]="`text-white text-${isP1() ? 'left' : 'right'}`">
            {{hoveredChar().name ? hoveredChar().name : 'Any/All'}}
        </span>
    </div>
</div>
