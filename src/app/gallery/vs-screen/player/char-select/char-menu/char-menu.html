<div [ngClass]="`py-2 px-2 bg-black/75 animate-open-h`">
    <div>
        <span class="block w-full text-center text-white italic text-2xl text-shadow-glow text-shadow-(color:--dfc-char-sel-glow)">Character Select</span>
        <div class="flex flex-row flex-wrap gap-1 py-2 justify-center">
            @for (char of this.playableCharacters; track char.abbr) {
                <!--Don't display DFCI exclusive characters if only DFC-->
                @if (!char.ignition || isIgnition()) {
                    <img
                        [ngSrc]="`../../../../../../assets/char-menu/lg/${char.abbr}.png`"
                        [ngClass]="`${isP1() ? 'hover:animate-p1-select' : 'hover:animate-p2-select'} cursor-pointer`"
                        width="56"
                        height="144"
                        (mouseenter)="hoveredChar.set(char)"
                        (click)="updateSelectedChar.emit(char)"  
                    />
                }
            }
        </div>
        <span [ngClass]="`block w-full text-white text-shadow-glow text-shadow-(color:--dfc-char-sel-glow) ${isP1() ? 'text-left' : 'text-right'}`">
            {{hoveredChar().name ? hoveredChar().name : 'Any/All'}}
        </span>
    </div>
</div>
