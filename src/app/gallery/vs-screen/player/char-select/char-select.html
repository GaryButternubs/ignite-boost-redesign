@if (!isFull()) {
    <mat-form-field>
        <mat-label>Select {{this.isP1() ? 'P1' : 'P2'}} character</mat-label>
        <mat-select [(value)]="selectedChar">
            <mat-option>
                <img 
                    [ngSrc]="`../../../../../assets/char-menu/sm/all.png`"
                    width="90"
                    height="90"
                />
                All
            </mat-option>
            @for (char of this.playableCharacters; track char.abbr) {
                <!--Don't display DFCI exclusive characters if only DFC-->
                @if (char.abbr !== 'all' && (isIgnition() || !char.ignition)) {
                    <mat-option [value]="char">
                        <img 
                            [ngSrc]="`../../../../../assets/char-menu/sm/${char.abbr}.png`"
                            width="90"
                            height="90"
                        />
                        {{char.name}}
                    </mat-option>
                }
            }
        </mat-select>
    </mat-form-field>
} @else {
    <button
        class="cursor-pointer" 
        (click)="isOpen.set(!isOpen())" 
        type="button" 
        cdkOverlayOrigin 
        #trigger="cdkOverlayOrigin"
    >
        <img
            [ngSrc]="`../../../../../assets/char-portraits/${this.selectedChar().abbr}_${this.isP1() ? 'p1' : 'p2'}.png`"
            width="596"
            height="395"
        />
    </button>
    <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="isOpen()"
        [cdkConnectedOverlayFlexibleDimensions]="true"
        [cdkConnectedOverlayPositions]="[
            {
                originX: (isP1()) ? 'start' : 'end',
                originY: 'center',
                overlayX: (isP1()) ? 'start' : 'end',
                overlayY: 'center'
            }
        ]"
        (detach)="isOpen.set(false)"
        (overlayOutsideClick)="isOpen.set(false)"
    >
        <app-char-menu 
            [isIgnition]="isIgnition()"
            [isP1]="isP1()"
            (updateSelectedChar)="updateSelectedChar($event)"
        />
    </ng-template>
}
