<div [ngClass]="`scale-100 p-1 bg-black ${isFull() ? `absolute bottom-1/50 ${isP1() ? '-right-1/50 -skew-y-4 skew-x-13' : '-left-1/50 skew-y-4 -skew-x-13'}` : ''}`">
    <div class="p-1 bg-gradient-to-r from-(--dfc-player-gradient-ends) via-(--dfc-player-gradient-center) to-(--dfc-player-gradient-ends)">
        <mat-form-field [ngClass]="`bg-black p-1 player-search flex ${isP1() ? 'justify-start' : 'justify-end'}`">
            <mat-label>{{`Player ${isP1() ? '1' : '2'}`}}</mat-label>
            <input matInput (change)="updatePlayerInput($event.target.value)" />
        </mat-form-field>
    </div>
</div>
