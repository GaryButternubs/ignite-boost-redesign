<button
    class="cursor-pointer animate-open-h"
    (click)="isOpen.set(!isOpen())"
    type="button"
    cdkOverlayOrigin
    #trigger
>
    @if (!isFull()) {
        <!--Replay Theater-->
        <img 
            [ngSrc]="`../../../../../assets/asst-menu/sm/${this.selectedAsst().abbr}.png`"
            width="90"
            height="48"
            priority
        />
    } @else {
        <!--VS Screen Replica-->
        <img 
            [ngSrc]="`../../../../../assets/asst-portraits/${this.selectedAsst().abbr}_${this.isP1() ? 'p1' : 'p2'}.png`"
            width="365"
            height="152"
            priority
        />

        <div [ngClass]="`${isP1() ? 'asst-sel-flash-p1' : 'asst-sel-flash-p2'} absolute top-0 animate-open-h-flash w-full h-full bg-white`"></div>

        <!--Wiki page icon-->
        @if (this.selectedAsst().name) {
            <a 
                matIconButton 
                [ariaLabel]="`${this.selectedAsst().short ?? this.selectedAsst().name}'s wiki page`" 
                [ngClass]="`absolute animate-hide-info-icon m-1 top-1/18 text-2xl *:overflow-visible ${isP1() ? 'left-0' : 'right-0'}`"
                [href]="this.selectedAsst().wiki"
                target="_blank"
            >
                <mat-icon class="text-shadow-glow text-shadow-(color:--portrait-glow) hover:text-shadow-(color:--char-sel-glow)" inline="true">info</mat-icon>
            </a>
        }
    }
</button>
<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayPositions]="!isFull() ? [
            {
                originX: isP1() ? 'start' : 'end',
                originY: 'bottom',
                overlayX: isP1() ? 'start' : 'end',
                overlayY: 'top',
            },
            {
                originX: isP1() ? 'end' : 'start',
                originY: 'bottom',
                overlayX: isP1() ? 'end' : 'start',
                overlayY: 'top',
            }
        ] : [
            {
                originX: (isP1()) ? 'start' : 'end',
                originY: 'center',
                overlayX: (isP1()) ? 'start' : 'end',
                overlayY: 'center'
            }
        ]"
    (detach)="isOpen.set(false)"
    (overlayOutsideClick)="isOpen.set(false)"
>
    @if (!isFull()) {
        <!--Standard Select-->
        <div 
            class="select-overlay"
            animate.enter="select-overlay-enter"
            animate.leave="select-overlay-leave"
        >
            <div (click)="updateSelectedAssist(assistCharacters[0])" [ngClass]="`select-option ${selectedAsst().name ? '' : 'bg-(--color-primary)/50'} hover:bg-white/25 *:text-white`">
                <div class="flex flex-row gap-2 items-center">
                    @defer {
                        <div animate.enter="select-overlay-enter" class="w-full flex flex-row gap-2 items-center cursor-pointer">
                            <img 
                                ngSrc="../../../../../assets/asst-menu/sm/all.png"
                                width="90"
                                height="48"
                                class="w-12 h-auto"
                            />
                            <span class="text-white text-lg">Any/All</span>
                        </div>
                    } @placeholder {
                        <mat-spinner diameter="28" />
                    }
                </div>
            </div>
            @for (char of this.sortedAssists; track char.abbr) {
                @if (char.abbr !== 'all' && (!char.ignition || isIgnition())) {
                    <div (click)="updateSelectedAssist(char)" [ngClass]="`select-option *:text-white ${(selectedAsst() === char) ? 'bg-(--color-primary)/50' : ''} hover:bg-white/25`">
                        @defer {
                            <div animate.enter="select-overlay-enter" class="w-full flex flex-row gap-2 items-center justify-between cursor-pointer">
                                <div class="flex flex-row gap-2 items-center">
                                    <img 
                                        [ngSrc]="`../../../../../assets/asst-menu/sm/${char.abbr}.png`"
                                        width="90"
                                        height="48"
                                        class="w-12 h-auto"
                                    />
                                    <span class="text-md">{{char.name}}</span>
                                </div>

                                <!--Mizuumi link-->
                                <a 
                                    matIconButton 
                                    [ariaLabel]="`${char.short ?? char.name}'s wiki page`" 
                                    class="flex justify-end text-4xl *:overflow-visible"
                                    [href]="char.wiki"
                                    target="_blank"
                                >
                                    <mat-icon class="text-shadow-glow text-shadow-(color:--char-sel-glow) hover:text-shadow-(color:--portrait-glow)" inline="true">info</mat-icon>
                                </a>
                            </div>
                        } @placeholder {
                            <mat-spinner diameter="28" />
                        }
                    </div>
                }
            }
        </div>
    } @else {
        <app-assist-menu 
            [isIgnition]="isIgnition()"
            [isP1]="isP1()"
            [isOpen]="isOpen()"
            (updateSelectedAsst)="updateSelectedAssist($event)"
            animate.enter="animate-overlay-open-h"
            animate.leave="select-overlay-leave" 
        />
    }
</ng-template>
