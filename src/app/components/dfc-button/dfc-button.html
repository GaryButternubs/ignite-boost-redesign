<!--Check if function is empty-->
<div>
    @if (callback()) {
        <button matButton (click)="callback()" class="dfc-button h-fit w-fit bg-black p-1 text-white hover:text-shadow-glow hover:text-shadow-(color:--hover-glow) *:overflow-visible">
            <div class="dfc-button bg-linear-to-r from-(--button-gradient-start) via-(--button-gradient-end) to-(--button-gradient-start) p-1">
                <div class="dfc-button bg-black px-2 py-1">
                    <ng-content />
                </div>
            </div>
        </button>
    } @else {
        <a matButton [routerLink]="routerURL()" class="dfc-button h-fit w-fit bg-black p-1 text-white hover:text-shadow-glow hover:text-shadow-(color:--hover-glow) *:overflow-visible">
            <div class="dfc-button bg-linear-to-r from-(--button-gradient-start) via-(--button-gradient-end) to-(--button-gradient-start) p-1">
                <div class="dfc-button bg-black px-2 py-1">
                    <ng-content />
                </div>
            </div>
        </a>
    }
</div>
