<img 
    [ngSrc]="fragment.src" 
    [width]="fragment.width" 
    [height]="fragment.height"
    [class]="`absolute transition-opacity duration-100`"
    [ngStyle]="{
        'scale': `${this.scale()}%`,
        'opacity': `${this.visible() ? this.opacity : 0}%`,
        'left': `${this.travelX() ? (this.xPos() + this.totalMoveAmt()) : this.xPos()}px`,
        'bottom': `${this.travelX() ? this.yPos() : (this.yPos() + this.totalMoveAmt())}px`
    }"
/>
